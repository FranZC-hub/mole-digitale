name: MasGioielli — collaudo e deploy (FTP)

# Solo il progetto in masgioielli/ e solo dal suo branch: il sito di Mole Digitale
# ha il suo workflow (deploy.yml) e non viene toccato.
on:
  push:
    branches: [masgioielli-produzione]
    paths: ['masgioielli/**', '.github/workflows/masgioielli.yml']
  workflow_dispatch:

concurrency:
  group: masgioielli-deploy
  cancel-in-progress: false

jobs:
  collaudo-e-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masgioielli
    env:
      # il deploy parte solo quando i secret dell'hosting ci sono (si decide dove pubblicare dopo)
      HAS_FTP: ${{ secrets.MAS_FTP_HOST != '' && secrets.MAS_FTP_USER != '' && secrets.MAS_FTP_PASS != '' }}
      # dominio definitivo per canonical, sitemap e anteprime (variabile di repository, facoltativa)
      SITO_URL: ${{ vars.MAS_SITO_URL || 'https://www.masgioielli.it' }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: masgioielli/package-lock.json

      - name: PHP 8.3 (come sugli hosting)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, gd
          coverage: none

      - name: Installa dipendenze
        run: npm ci --no-audit --no-fund

      - name: Collaudo dell'API (blocca il deploy se qualcosa non va)
        run: node tools/prova-api.mjs

      - name: Build + controllo dei link (blocca il deploy se rotti)
        run: npm run build

      - name: Carica dist/ via FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MAS_FTP_HOST }}
          username: ${{ secrets.MAS_FTP_USER }}
          password: ${{ secrets.MAS_FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./masgioielli/dist/
          # cartella PUBBLICA del sito sul server (es. ./www.masgioielli.it/ su Aruba, ./ se l'utenza FTP entra gia' li')
          server-dir: ${{ secrets.MAS_FTP_DIR || './' }}
          log-level: standard
          # Sul server ci sono file che il deploy NON deve mai toccare ne' cancellare:
          # la configurazione con le password e le foto caricate dal negozio.
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            uploads/pezzi/**
            **/*-cyrillic-*.woff2
            **/*-cyrillic-ext-*.woff2
            **/*-greek-*.woff2
            **/*-greek-ext-*.woff2
            **/*-vietnamese-*.woff2

      - name: Avviso (hosting non ancora configurato)
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Collaudo e build OK. Deploy saltato perche' mancano i secret MAS_FTP_HOST / MAS_FTP_USER / MAS_FTP_PASS (e MAS_FTP_DIR)."
